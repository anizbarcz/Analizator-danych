name: "Testy i kontrola jakości"

on:
    push:
        branches: [main]
        paths-ignore:
            - '**/*.md'
    pull_request:
        branches: [main]
        paths-ignore:
            - '*/*.md'

            #co mamy zrobić
jobs:
    testy:
        #runs określa środowsiko w którym zadanie zostanie wykonane
        runs-on: ubuntu-24.04

        #jakie kroki są do wykonania
        steps:
            - name: pobranie kodu
              uses: actions/checkout@v4
            #uses - wykorzystanie akcji GitHubActions
            #actions - odwołanie do właściciela repozytorium
            #checkout@v4 - nazwa akcji pobierającej kod ze wskazaniem wersji
            - name: instalacja Pythona
              uses: actions/setup-python@v5
              with:
                python-version: '3.15'

            - name: instalacja zależności
              run: |
                python -m pip install --upgrade pip
                python -m pip install -r requirements.txt
            # - name: Sprawdzenie jakości kodu
            #   run: python -m ruff check .
            - name: Uruchomienie testu
              run: python -m pytest -v